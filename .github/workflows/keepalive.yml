# Facultatif : empêche la mise en veille du projet Supabase gratuit
# (il est mis en pause après 7 jours sans activité).
# Envoie une petite requête de lecture tous les 3 jours.
# À configurer : Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_URL  (ex. https://abcdefgh.supabase.co)
#   SUPABASE_KEY  (la clé publique, la même que dans js/config.js)
#   GROUP_CODE    (le code d'invitation de votre groupe)
name: Garder Supabase éveillé
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête de lecture
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
          CODE: ${{ secrets.GROUP_CODE }}
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/join_group" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"p_code\":\"$CODE\"}"
